name: DevSecOps CI/CD Pipeline

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:
  schedule:
    # Weekly re-scan + external link check (Mondays 06:23 UTC).
    # New CVEs / CodeQL queries / dead external links show up even when the code doesn't change.
    - cron: "23 6 * * 1"

# ── Least privilege: nothing granted globally. Each job opts in to what it needs. ──
permissions: {}

# One run per branch/PR. Superseded PR runs are cancelled; runs on master are never
# cancelled mid-flight so a deploy can't be interrupted.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Hugo build image. Upgrading Hugo also requires updating the vendored PaperMod theme
  # (see PR notes). Pin by digest once you've looked it up:
  #   docker buildx imagetools inspect floryn90/hugo:0.120.4-ext-alpine
  #   -> floryn90/hugo:0.120.4-ext-alpine@sha256:<digest>
  HUGO_IMAGE: floryn90/hugo:0.120.4-ext-alpine
  SITE_URL: https://prajwolbikramadhikari.com.np

jobs:
  # ── Gate 1: Secret scanning (full history) ──────────────────────────
  secret-scan:
    name: Gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read # list PR commits
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: false # findings go to the job summary; avoids needing pull-requests: write

  # ── Gate 2: SAST (CodeQL) ───────────────────────────────────────────
  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@1190a975f95ce23525efb6a3fc21ea29567c1b52 # v3.38.2
        with:
          # javascript = your assets/js; actions = this workflow file itself
          # (catches injection / over-permission issues in CI).
          languages: javascript-typescript, actions
          build-mode: none # interpreted languages: no autobuild needed
          config: |
            paths-ignore:
              - themes/**
              - public/**
              - resources/**
      - uses: github/codeql-action/analyze@1190a975f95ce23525efb6a3fc21ea29567c1b52 # v3.38.2

  # ── Gate 3: Dependency review (PRs only) ────────────────────────────
  # There's no package.json, so today this mainly reviews GitHub Actions
  # version changes in PRs (e.g. Dependabot bumps).
  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high

  # ── Build (runs in parallel with the gates; deploy waits for all) ──
  build:
    name: Build Hugo
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      # PaperMod is vendored in themes/ (not a real submodule), so no submodule checkout.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build with Docker (non-root)
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -v "${GITHUB_WORKSPACE}:/src" \
            -w /src \
            "${HUGO_IMAGE}" \
            --minify --gc

      - name: Sanity-check output
        run: |
          test -s public/index.html
          test -s public/sitemap.xml
          echo "Built $(find public -name '*.html' | wc -l) HTML pages" >> "$GITHUB_STEP_SUMMARY"

      # Uncompressed copy for link check + Lighthouse
      - name: Upload site artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: public-site
          path: public/
          retention-days: 7
          if-no-files-found: error

      # Tarball in the format deploy-pages expects (only needed when we might deploy)
      - name: Upload Pages artifact
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: public/

  # ── Quality: link check ─────────────────────────────────────────────
  link-check:
    name: Link Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [build]
    permissions:
      contents: read
    steps:
      - name: Download site
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: public-site
          path: public/

      # Internal links: offline, fast, deterministic -> blocks deploy.
      # Absolute links to our own domain are remapped to the local build.
      - name: Internal links (blocking)
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: >-
            --offline --no-progress
            --root-dir '${{ github.workspace }}/public'
            --index-files index.html
            --remap 'https://(www\.)?prajwolbikramadhikari\.com\.np/(.*) file://${{ github.workspace }}/public/$2'
            'public/**/*.html'
          output: lychee/internal.md

      # External links: network-dependent and flaky -> weekly/manual only, never blocks.
      - name: External links (report only)
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: >-
            --no-progress --max-concurrency 8 --max-retries 2
            --root-dir '${{ github.workspace }}/public'
            --scheme https --scheme http
            --accept '200..=299,403,429'
            --exclude 'prajwolbikramadhikari\.com\.np'
            --exclude 'linkedin\.com'
            'public/**/*.html'
          output: lychee/external.md
          fail: false

  # ── Quality: Lighthouse ─────────────────────────────────────────────
  lighthouse:
    name: Lighthouse Audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [build]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .lighthouserc.json
          sparse-checkout-cone-mode: false

      - name: Download site
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: public-site
          path: public/

      # Search Console verification + 404 aren't content pages; they'd skew the audit.
      - name: Prune non-content files from audit
        run: rm -f public/google*.html public/404.html

      # Upload target (temporary-public-storage) is set in .lighthouserc.json — single source of truth.
      - name: Serve & audit
        uses: treosh/lighthouse-ci-action@72f881228236981b625ed765b928efb1786a1f55 # v11
        with:
          configPath: .lighthouserc.json
          uploadArtifacts: true

  # ── Deploy + smoke test (master only, never from PRs) ──────────────
  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [secret-scan, codeql, dependency-review, build, link-check, lighthouse]
    # dependency-review is skipped on push; !failure() treats skipped as OK
    # but still blocks if any gate failed.
    if: >-
      !failure() && !cancelled()
      && github.ref == 'refs/heads/master'
      && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    permissions:
      pages: write # publish to Pages
      id-token: write # OIDC token for deploy-pages — no stored secrets
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
      # Bot Fight Mode (Cloudflare) challenges requests from datacenter IPs like
      # GitHub runners, so the smoke test goes straight to GitHub Pages instead.
      # -k: Pages holds no cert for our domain while Cloudflare proxies it.
      - name: Smoke test (GitHub Pages origin)
        env:
          PAGES_IP: 185.199.108.153
        run: |
          set -euo pipefail
          host="${SITE_URL#https://}"
          check() { # usage: check <expected-code> <host> <path>
            code=$(curl -ksS -o /dev/null -w '%{http_code}' \
                   --retry 5 --retry-delay 10 --retry-all-errors \
                   --resolve "$2:443:${PAGES_IP}" "https://$2$3")
            echo "${code}  https://$2$3 (expected $1)" | tee -a "$GITHUB_STEP_SUMMARY"
            [ "$code" = "$1" ] || { echo "::error::https://$2$3 returned ${code}, expected $1"; exit 1; }
          }
          sleep 15 # give Pages a moment to publish the new build
          for path in / /projects/ /blog/ /lab/ /sitemap.xml /index.json; do
            check 200 "$host" "$path"
          done
          check 301 "www.${host}" / # www should redirect to the main domain
